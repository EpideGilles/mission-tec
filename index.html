
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission TEC — Test V0.9</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101d2b;color:#fff;font-family:Arial,sans-serif}
main{max-width:1300px;margin:auto;padding:15px}
h1{font-size:23px}
.scene{position:relative;width:100%;aspect-ratio:1670/942;overflow:hidden;border-radius:12px}
.scene img{width:100%;height:100%;object-fit:fill;display:block}
.zone{position:absolute;left:0;top:55%;width:33%;height:45%;cursor:pointer;background:transparent;border:0}
.zone:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.panel{margin-top:15px;padding:16px;background:#20374b;border-radius:10px}
button.action{background:#278e77;color:white;border:0;border-radius:8px;padding:12px 18px;margin:5px;cursor:pointer;font-weight:bold}
#message{line-height:1.5}
</style>
</head>
<body>
<main>
<h1>🎮 Mission TEC — Test du lit gauche</h1>
<div class="scene">
<img id="photo" src="avant.png" alt="Chambre à inspecter">
<button class="zone" id="lit" aria-label="Examiner le lit gauche"></button>
</div>
<div class="panel">
<p id="message">Observe la chambre et clique sur le lit gauche.</p>
<button class="action" id="corriger" hidden>Refaire correctement le lit</button>
<button class="action" id="recommencer">Recommencer</button>
</div>
</main>
<script>
const photo=document.getElementById("photo");
const message=document.getElementById("message");
const corriger=document.getElementById("corriger");

document.getElementById("lit").onclick=()=>{
 if(photo.getAttribute("src")==="avant.png"){
  message.textContent="Le lit n'est pas fait. Que faut-il faire ?";
  corriger.hidden=false;
 }
};

corriger.onclick=()=>{
 photo.src="apres.png";
 message.textContent="Bravo ! Le lit est correctement fait.";
 corriger.hidden=true;
};

document.getElementById("recommencer").onclick=()=>{
 photo.src="avant.png";
 message.textContent="Observe la chambre et clique sur le lit gauche.";
 corriger.hidden=true;
};
</script>
</body>
</html>
