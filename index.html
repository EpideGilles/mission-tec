
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission TEC — Chambre V1.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101d2b;color:white;font-family:Arial,sans-serif}
main{max-width:1300px;margin:auto;padding:15px}
h1{font-size:23px}
.scene{
 position:relative;width:100%;aspect-ratio:1670/942;
 overflow:hidden;border-radius:12px;background:#222
}
.scene img{
 position:absolute;inset:0;width:100%;height:100%;
 object-fit:fill;pointer-events:none
}
#solCorrige{
 display:none;
 clip-path:polygon(
  33% 70%,37% 67%,43% 68%,49% 72%,
  57% 76%,60% 84%,59% 94%,49% 97%,
  38% 96%,33% 90%
 )
}
#litCorrige{
 display:none;
 clip-path:polygon(
  0% 57%,8% 55%,18% 55%,30% 56%,
  33% 62%,33% 90%,31% 100%,0% 100%
 )
}
.zone{
 position:absolute;background:transparent;border:0;
 cursor:pointer
}
.zone:focus-visible{outline:3px solid yellow;outline-offset:-3px}
#zoneLit{left:0;top:55%;width:33%;height:45%}
#zoneSol{left:34%;top:68%;width:26%;height:27%}
.panel{
 margin-top:15px;padding:16px;background:#20374b;
 border-radius:10px
}
button.action{
 background:#278e77;color:white;border:0;
 border-radius:8px;padding:12px 18px;
 margin:5px;cursor:pointer;font-weight:bold
}
button.secondary{background:#425d73}
#choix{display:none}
#message{line-height:1.5}
</style>
</head>
<body>
<main>
<h1>🎮 Mission TEC — Remise en ordre de la chambre</h1>
<div class="scene">
 <img src="avant.png" alt="Chambre en désordre">
 <img id="solCorrige" src="sol_corrige.png" alt="">
 <img id="litCorrige" src="lit_corrige.png" alt="">
 <button class="zone" id="zoneLit" aria-label="Examiner le lit gauche"></button>
 <button class="zone" id="zoneSol" aria-label="Examiner les vêtements au sol"></button>
</div>

<div class="panel">
 <p id="progression">Corrections réalisées : 0 / 2</p>
 <p id="message">Observe la chambre et clique sur une anomalie.</p>
 <div id="choix">
  <button class="action" id="correct"></button>
  <button class="action secondary" id="incorrect1"></button>
  <button class="action secondary" id="incorrect2"></button>
 </div>
 <button class="action secondary" id="recommencer">Recommencer</button>
</div>
</main>

<script>
const lit=document.getElementById("litCorrige");
const sol=document.getElementById("solCorrige");
const message=document.getElementById("message");
const choix=document.getElementById("choix");
const correct=document.getElementById("correct");
const incorrect1=document.getElementById("incorrect1");
const incorrect2=document.getElementById("incorrect2");
const progression=document.getElementById("progression");

let litFait=false;
let solRange=false;
let selection=null;

function afficherProgression(){
 progression.textContent=
 "Corrections réalisées : "+Number(litFait+solRange)+" / 2";
}

function examiner(type){
 if(type==="lit" && litFait)return;
 if(type==="sol" && solRange)return;

 selection=type;
 choix.style.display="block";

 if(type==="lit"){
  message.textContent="Le lit gauche est défait. Que fais-tu ?";
  correct.textContent="Refaire correctement le lit";
  incorrect1.textContent="Le laisser comme ça";
  incorrect2.textContent="Cacher la couverture sous le lit";
 }else{
  message.textContent="Des vêtements et des chaussures traînent au sol. Que fais-tu ?";
  correct.textContent="Les ranger à leur place";
  incorrect1.textContent="Les poser sur le lit";
  incorrect2.textContent="Les laisser au sol";
 }
}

document.getElementById("zoneLit").onclick=()=>examiner("lit");
document.getElementById("zoneSol").onclick=()=>examiner("sol");

correct.onclick=()=>{
 if(selection==="lit"){
  litFait=true;
  lit.style.display="block";
  message.textContent="Bravo ! Le lit gauche est correctement fait.";
 }
 if(selection==="sol"){
  solRange=true;
  sol.style.display="block";
  message.textContent=
   "Bravo ! Les vêtements et les chaussures sont rangés. Attention : le lisseur reste à sécuriser.";
 }
 choix.style.display="none";
 selection=null;
 afficherProgression();
};

function mauvaiseReponse(){
 message.textContent=
 "Ce n'est pas la bonne solution. Réfléchis à la façon de garder une chambre propre et sécurisée.";
}

incorrect1.onclick=mauvaiseReponse;
incorrect2.onclick=mauvaiseReponse;

document.getElementById("recommencer").onclick=()=>{
 litFait=false;
 solRange=false;
 selection=null;
 lit.style.display="none";
 sol.style.display="none";
 choix.style.display="none";
 message.textContent="Observe la chambre et clique sur une anomalie.";
 afficherProgression();
};
</script>
</body>
</html>
