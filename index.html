
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission TEC — Test V1.0</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101d2b;
  color:white;
  font-family:Arial,sans-serif;
}
main{max-width:1300px;margin:auto;padding:15px}
h1{font-size:23px}
.scene{
  position:relative;
  width:100%;
  aspect-ratio:1670/942;
  overflow:hidden;
  border-radius:12px;
  background:#222;
}
.scene img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;
}
#litCorrige{
  display:none;
  clip-path:polygon(
    0% 57%,
    8% 55%,
    18% 55%,
    30% 56%,
    33% 62%,
    33% 90%,
    31% 100%,
    0% 100%
  );
}
.zone{
  position:absolute;
  left:0;
  top:55%;
  width:33%;
  height:45%;
  cursor:pointer;
  background:transparent;
  border:0;
}
.zone:focus-visible{
  outline:3px solid white;
  outline-offset:-3px;
}
.panel{
  margin-top:15px;
  padding:16px;
  background:#20374b;
  border-radius:10px;
}
button.action{
  background:#278e77;
  color:white;
  border:0;
  border-radius:8px;
  padding:12px 18px;
  margin:5px;
  cursor:pointer;
  font-weight:bold;
}
#message{line-height:1.5}
</style>
</head>
<body>
<main>
<h1>🎮 Mission TEC — Test du lit gauche V1.0</h1>

<div class="scene">
  <img src="avant.png" alt="Chambre en désordre">
  <img id="litCorrige" src="lit_corrige.png" alt="">
  <button class="zone" id="lit"
    aria-label="Examiner le lit gauche"></button>
</div>

<div class="panel">
  <p id="message">
    Observe la chambre et clique sur le lit gauche.
  </p>
  <button class="action" id="corriger" hidden>
    Refaire correctement le lit
  </button>
  <button class="action" id="recommencer">
    Recommencer
  </button>
</div>
</main>

<script>
const litCorrige=document.getElementById("litCorrige");
const message=document.getElementById("message");
const corriger=document.getElementById("corriger");

document.getElementById("lit").onclick=()=>{
  if(litCorrige.style.display!=="block"){
    message.textContent=
      "Le lit n'est pas fait. Que faut-il faire ?";
    corriger.hidden=false;
  }
};

corriger.onclick=()=>{
  litCorrige.style.display="block";
  message.textContent=
    "Bravo ! Le lit gauche est correctement fait.";
  corriger.hidden=true;
};

document.getElementById("recommencer").onclick=()=>{
  litCorrige.style.display="none";
  message.textContent=
    "Observe la chambre et clique sur le lit gauche.";
  corriger.hidden=true;
};
</script>
</body>
</html>
