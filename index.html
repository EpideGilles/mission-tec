
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mission TEC — Chambre V1.2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101d2b;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1300px;
  margin: auto;
  padding: 15px;
}

h1 {
  font-size: 24px;
  margin-bottom: 8px;
}

.subtitle {
  color: #b9cfdd;
  margin-bottom: 16px;
}

.scene {
  position: relative;
  width: 100%;
  aspect-ratio: 1670 / 942;
  overflow: hidden;
  border-radius: 12px;
  background: #222;
}

.scene img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
}

/* CORRECTION DU LIT */
#litCorrige {
  display: none;
  clip-path: polygon(
    0% 57%,
    8% 55%,
    18% 55%,
    30% 56%,
    33% 62%,
    33% 90%,
    31% 100%,
    0% 100%
  );
}

/* CORRECTION DES VETEMENTS AU SOL */
#solCorrige {
  display: none;
  clip-path: polygon(
    33% 70%,
    37% 67%,
    43% 68%,
    49% 72%,
    57% 76%,
    60% 84%,
    59% 94%,
    49% 97%,
    38% 96%,
    33% 90%
  );
}

/* CORRECTION DU LISSEUR */
#lisseurCorrige {
  display: none;
  clip-path: inset(0);
}

/* ZONES INTERACTIVES */
.zone {
  position: absolute;
  background: transparent;
  border: 0;
  cursor: pointer;
}

.zone:focus-visible {
  outline: 3px solid yellow;
  outline-offset: -3px;
}

#zoneLit {
  left: 0;
  top: 55%;
  width: 33%;
  height: 45%;
}

#zoneSol {
  left: 34%;
  top: 68%;
  width: 26%;
  height: 27%;
}

#zoneLisseur {
  left: 61%;
  top: 70%;
  width: 16%;
  height: 14%;
}

/* INTERFACE */
.panel {
  margin-top: 15px;
  padding: 18px;
  background: #20374b;
  border-radius: 10px;
}

.progression {
  font-weight: bold;
  color: #8fe3c9;
  margin-bottom: 12px;
}

#message {
  line-height: 1.5;
}

button.action {
  background: #278e77;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 12px 18px;
  margin: 5px;
  cursor: pointer;
  font-weight: bold;
}

button.secondary {
  background: #425d73;
}

#choix {
  display: none;
}

#choix button {
  display: inline-block;
}

@media(max-width: 650px) {
  h1 {
    font-size: 20px;
  }

  button.action {
    width: 100%;
    margin: 5px 0;
  }
}
</style>
</head>

<body>
<main>

<h1>🎮 Mission TEC — Remise en ordre de la chambre</h1>

<p class="subtitle">
  Observe la chambre, repère les anomalies et prends les bonnes décisions.
</p>

<div class="scene">

  <!-- PHOTOGRAPHIE DE DEPART -->
  <img src="avant.png" alt="Chambre en désordre">

  <!-- CORRECTIONS INDEPENDANTES -->
  <img id="litCorrige" src="lit_corrige.png" alt="">
  <img id="solCorrige" src="sol_corrige.png" alt="">
  <img id="lisseurCorrige" src="lisseur_corrige.png" alt="">

  <!-- ZONES DE CLIC -->
  <button
    class="zone"
    id="zoneLit"
    aria-label="Examiner le lit gauche">
  </button>

  <button
    class="zone"
    id="zoneSol"
    aria-label="Examiner les vêtements au sol">
  </button>

  <button
    class="zone"
    id="zoneLisseur"
    aria-label="Examiner le lisseur allumé">
  </button>

</div>

<div class="panel">

  <div class="progression" id="progression">
    Corrections réalisées : 0 / 3
  </div>

  <p id="message">
    Observe la chambre et clique sur une anomalie.
  </p>

  <div id="choix">
    <button class="action" id="correct"></button>
    <button class="action secondary" id="incorrect1"></button>
    <button class="action secondary" id="incorrect2"></button>
  </div>

  <button class="action secondary" id="recommencer">
    🔄 Recommencer
  </button>

</div>

</main>

<script>

/* ELEMENTS DE LA PAGE */

const lit = document.getElementById("litCorrige");
const sol = document.getElementById("solCorrige");
const lisseur = document.getElementById("lisseurCorrige");

const message = document.getElementById("message");
const choix = document.getElementById("choix");

const correct = document.getElementById("correct");
const incorrect1 = document.getElementById("incorrect1");
const incorrect2 = document.getElementById("incorrect2");

const progression = document.getElementById("progression");

/* ETATS INDEPENDANTS */

let litFait = false;
let solRange = false;
let lisseurSecurise = false;

let selection = null;

/* PROGRESSION */

function afficherProgression() {

  const total =
    Number(litFait) +
    Number(solRange) +
    Number(lisseurSecurise);

  progression.textContent =
    "Corrections réalisées : " + total + " / 3";

  if (total === 3) {
    message.textContent =
      "Bravo ! Tu as corrigé les trois premières anomalies. D'autres dangers restent à identifier dans la chambre.";
  }
}

/* EXAMINER UNE ANOMALIE */

function examiner(type) {

  if (type === "lit" && litFait) return;
  if (type === "sol" && solRange) return;
  if (type === "lisseur" && lisseurSecurise) return;

  selection = type;
  choix.style.display = "block";

  if (type === "lit") {

    message.textContent =
      "Le lit gauche est défait. Que fais-tu ?";

    correct.textContent =
      "Refaire correctement le lit";

    incorrect1.textContent =
      "Le laisser comme ça";

    incorrect2.textContent =
      "Cacher la couverture sous le lit";

  } else if (type === "sol") {

    message.textContent =
      "Des vêtements et des chaussures traînent au sol. Que fais-tu ?";

    correct.textContent =
      "Ranger les vêtements et les chaussures à leur place";

    incorrect1.textContent =
      "Tout poser sur le lit";

    incorrect2.textContent =
      "Les laisser au sol";

  } else if (type === "lisseur") {

    message.textContent =
      "Un lisseur encore allumé est posé sur le sol. Quelle est la bonne procédure ?";

    correct.textContent =
      "Éteindre, débrancher, laisser refroidir en sécurité, puis ranger";

    incorrect1.textContent =
      "Le ranger immédiatement dans l'armoire";

    incorrect2.textContent =
      "Le laisser refroidir sur le lit";
  }
}

/* CLIC SUR LES OBJETS */

document.getElementById("zoneLit").onclick =
  () => examiner("lit");

document.getElementById("zoneSol").onclick =
  () => examiner("sol");

document.getElementById("zoneLisseur").onclick =
  () => examiner("lisseur");

/* BONNE REPONSE */

correct.onclick = () => {

  if (selection === "lit") {

    litFait = true;
    lit.style.display = "block";

    message.textContent =
      "Bravo ! Le lit gauche est correctement fait.";

  } else if (selection === "sol") {

    solRange = true;
    sol.style.display = "block";

    message.textContent =
      "Bravo ! Les vêtements et les chaussures sont rangés.";

  } else if (selection === "lisseur") {

    lisseurSecurise = true;
    lisseur.style.display = "block";

    message.textContent =
      "Bravo ! Le lisseur est éteint, débranché et a refroidi sur une surface adaptée avant d'être rangé.";
  }

  choix.style.display = "none";
  selection = null;

  afficherProgression();
};

/* MAUVAISE REPONSE */

function mauvaiseReponse() {

  message.textContent =
    "Ce n'est pas la bonne solution. Réfléchis aux règles d'hygiène, de rangement et de sécurité.";
}

incorrect1.onclick = mauvaiseReponse;
incorrect2.onclick = mauvaiseReponse;

/* RECOMMENCER */

document.getElementById("recommencer").onclick = () => {

  litFait = false;
  solRange = false;
  lisseurSecurise = false;

  selection = null;

  lit.style.display = "none";
  sol.style.display = "none";
  lisseur.style.display = "none";

  choix.style.display = "none";

  message.textContent =
    "Observe la chambre et clique sur une anomalie.";

  afficherProgression();
};

afficherProgression();

</script>

</body>
</html>
